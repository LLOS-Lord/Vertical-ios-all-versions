[package]
name = "horizon-mod-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Why an installed mod does or does not affect the game: a per-mod diagnosis from the files on disk, the effect it declares, and the input, asset and hook mechanisms available on this build"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
