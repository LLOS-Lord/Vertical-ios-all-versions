[package]
name = "horizon-mod-shim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The mod loader API shim: maps a mod's declared hooks, events, keybinds, commands, screens and network channels onto Horizon's native extension points, and reports precisely which of them are wired, which are native-equivalent, and which are absent — so a ported mod's silent no-op becomes a named gap"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
